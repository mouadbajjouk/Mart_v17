<header class="modern-header bg-white/95 backdrop-blur-lg border-b border-slate-200/50 sticky top-0 z-50 shadow-sm">
  <div class="container mx-auto px-6">
    <div class="flex items-center justify-between h-20">
      
      <!-- Logo Section -->
      <div class="flex items-center space-x-4">
        <div class="relative">
          <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl blur-lg opacity-30"></div>
          <div class="relative bg-gradient-to-r from-blue-600 to-purple-600 p-3 rounded-xl shadow-lg">
            <svg
              width="28"
              height="30"
              viewBox="0 0 33 35"
              fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M15.1934 0V0V0L0.0391235 5.38288L2.35052 25.3417L15.1934 32.427V32.427V32.427L28.0364 25.3417L30.3478 5.38288L15.1934 0Z"
                fill="white" />
              <path
                d="M19.6399 15.3776L18.1861 15.0547L19.3169 16.6695V21.6755L23.1938 18.4458V12.9554L21.4169 13.6013L19.6399 15.3776Z"
                fill="rgba(59, 130, 246, 0.8)" />
              <path
                d="M10.5936 15.3776L12.0474 15.0547L10.9166 16.6695V21.6755L7.03966 18.4458V12.9554L8.81661 13.6013L10.5936 15.3776Z"
                fill="rgba(59, 130, 246, 0.8)" />
            </svg>
          </div>
        </div>
        <div class="flex flex-col">
          <h1 class="text-2xl font-black text-slate-800 leading-none">
            <span class="bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">Mart</span>
          </h1>
          <span class="text-xs text-slate-500 font-medium">Premium Shopping</span>
        </div>
      </div>

      <!-- Navigation Menu -->
      <nav class="hidden lg:flex items-center space-x-8">
        <a *ngFor="let item of items"
           [routerLink]="item.routerLink"
           routerLinkActive="active-nav-link"
           class="nav-link relative px-4 py-2 text-slate-700 font-semibold hover:text-blue-600 transition-all duration-300 group">
          <span [class]="item.icon + ' mr-2'"></span>
          {{ item.label }}
          <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-gradient-to-r from-blue-600 to-purple-600 group-hover:w-full transition-all duration-300"></div>
        </a>
      </nav>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-4">
        <!-- Guest Actions -->
        <div *ngIf="!authService.isLoggedIn()" class="flex items-center space-x-3">
          <p-button
            label="Login"
            size="small"
            [outlined]="true"
            (onClick)="navigateTo('auth/login')"
            styleClass="modern-login-btn border-2 border-slate-300 text-slate-700 hover:border-blue-500 hover:text-blue-600 px-6 py-2 font-semibold rounded-xl transition-all duration-300" />
          <p-button
            label="Register"
            size="small"
            (onClick)="navigateTo('auth/register')"
            styleClass="modern-register-btn bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 border-0 text-white px-6 py-2 font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all duration-300" />
        </div>

        <!-- Authenticated User Actions -->
        <div class="flex items-center space-x-4" *ngIf="authService.isLoggedIn()">
          <div class="hidden md:flex items-center space-x-3">
            <span class="text-slate-700 font-medium">Welcome</span>
            <span class="font-bold text-blue-600">{{ authService.currentUserSig()?.fullName }}</span>
          </div>

          <div class="flex items-center space-x-3">
            <p-button
              (onClick)="navigateTo('cart')"
              icon="pi pi-shopping-cart"
              [outlined]="true"
              size="small"
              styleClass="modern-cart-btn border-2 border-slate-300 text-slate-700 hover:border-blue-500 hover:text-blue-600 rounded-xl transition-all duration-300" />

            <p-avatar
              image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
              shape="circle"
              size="normal"
              styleClass="shadow-lg border-2 border-white" />

            <p-button
              *ngIf="authService.isAdmin()"
              label="Dashboard"
              size="small"
              icon="pi pi-cog"
              (click)="navigateTo('admin/dashboard')"
              styleClass="modern-dashboard-btn bg-gradient-to-r from-emerald-500 to-green-500 hover:from-emerald-600 hover:to-green-600 border-0 text-white px-4 py-2 font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all duration-300" />

            <p-button
              label="Logout"
              size="small"
              icon="pi pi-sign-out"
              (click)="logout()"
              styleClass="modern-logout-btn bg-gradient-to-r from-red-500 to-pink-500 hover:from-red-600 hover:to-pink-600 border-0 text-white px-4 py-2 font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all duration-300" />
          </div>
        </div>

        <!-- Mobile Menu Button -->
        <p-button
          icon="pi pi-bars"
          [outlined]="true"
          size="small"
          class="lg:hidden"
          styleClass="mobile-menu-btn border-2 border-slate-300 text-slate-700 hover:border-blue-500 hover:text-blue-600 rounded-xl transition-all duration-300" />
      </div>
    </div>
  </div>
</header>
