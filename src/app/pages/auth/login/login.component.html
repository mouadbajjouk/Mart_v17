<!-- Modern Login Page with Home Design System -->
<div class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-900 flex items-center justify-center p-6 relative overflow-hidden">
  
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute -top-1/2 -right-1/2 w-full h-full bg-gradient-to-br from-blue-500/20 to-purple-500/20 rounded-full blur-3xl animate-pulse"></div>
    <div class="absolute -bottom-1/2 -left-1/2 w-full h-full bg-gradient-to-tr from-indigo-500/20 to-cyan-500/20 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
  </div>

  <div class="relative w-full max-w-md">
    <!-- Back to Home Button -->
    <div class="mb-8">
      <p-button
        [link]="true"
        icon="pi pi-arrow-left"
        label="Back to home"
        (onClick)="goToHome()"
        styleClass="modern-back-btn text-white/80 hover:text-white transition-all duration-300 backdrop-blur-sm hover:bg-white/10 rounded-xl px-4 py-2" />
    </div>

    <!-- Login Card -->
    <div class="relative">
      <!-- Glass Card Background -->
      <div class="absolute inset-0 bg-white/10 backdrop-blur-xl rounded-3xl border border-white/20 shadow-2xl"></div>
      
      <div class="relative p-10">
        <!-- Header Section -->
        <div class="text-center mb-10">
          <!-- Logo -->
          <div class="flex justify-center mb-6">
            <div class="relative">
              <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl blur-lg opacity-50"></div>
              <div class="relative bg-gradient-to-r from-blue-600 to-purple-600 p-4 rounded-xl shadow-xl">
                <svg
                  width="32"
                  height="34"
                  viewBox="0 0 33 35"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M15.1934 0V0V0L0.0391235 5.38288L2.35052 25.3417L15.1934 32.427V32.427V32.427L28.0364 25.3417L30.3478 5.38288L15.1934 0Z"
                    fill="white" />
                  <path
                    d="M19.6399 15.3776L18.1861 15.0547L19.3169 16.6695V21.6755L23.1938 18.4458V12.9554L21.4169 13.6013L19.6399 15.3776Z"
                    fill="rgba(59, 130, 246, 0.8)" />
                  <path
                    d="M10.5936 15.3776L12.0474 15.0547L10.9166 16.6695V21.6755L7.03966 18.4458V12.9554L8.81661 13.6013L10.5936 15.3776Z"
                    fill="rgba(59, 130, 246, 0.8)" />
                </svg>
              </div>
            </div>
          </div>
          
          <h1 class="text-4xl font-black text-white mb-2">
            Welcome Back
          </h1>
          <p class="text-blue-100/80 text-lg font-light">
            Sign in to your <span class="bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent font-bold">Mart</span> account
          </p>
        </div>

        <!-- Login Form -->
        <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="space-y-6">
          
          <!-- Email Field -->
          <div class="space-y-2">
            <label for="email-address" class="block text-white/90 font-semibold text-sm">
              Email Address
            </label>
            <div class="relative">
              <input
                id="email-address"
                type="email"
                placeholder="Enter your email"
                pInputText
                aria-describedby="email-address-help"
                [(ngModel)]="userLogin.email"
                name="email"
                class="modern-input w-full px-4 py-4 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl text-white placeholder-white/50 focus:border-blue-400 focus:bg-white/15 transition-all duration-300" />
              <i class="pi pi-envelope absolute right-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label for="password" class="block text-white/90 font-semibold text-sm">
              Password
            </label>
            <p-password
              inputId="password"
              placeholder="Enter your password"
              styleClass="w-full modern-password"
              inputStyleClass="w-full px-4 py-4 bg-white/10 backdrop-blur-sm border border-white/20 rounded-xl text-white placeholder-white/50 focus:border-blue-400 focus:bg-white/15 transition-all duration-300"
              [toggleMask]="true"
              ariaLabel="password-help"
              [(ngModel)]="userLogin.password"
              name="password" />
          </div>

          <!-- Forgot Password -->
          <div class="text-right">
            <p-button
              label="Forgot password?"
              [link]="true"
              size="small"
              styleClass="modern-forgot-btn text-blue-300 hover:text-blue-200 transition-colors duration-300 font-medium" />
          </div>

          <!-- Login Button -->
          <div class="pt-4">
            <p-button
              label="Sign In"
              icon="pi pi-sign-in"
              size="large"
              [disabled]="!loginForm.form.valid"
              type="submit"
              styleClass="modern-login-submit w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 border-0 py-4 text-lg font-bold shadow-2xl hover:shadow-blue-500/25 transition-all duration-500 transform hover:scale-105 rounded-xl" />
          </div>

          <!-- Register Link -->
          <div class="text-center pt-6 border-t border-white/10">
            <div class="flex items-center justify-center space-x-2">
              <span class="text-white/70">Don't have an account?</span>
              <p-button
                label="Sign up"
                [link]="true"
                size="small"
                styleClass="modern-signup-link text-blue-300 hover:text-blue-200 font-bold transition-colors duration-300"
                (onClick)="goToRegister()" />
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
